worker_processes 1;
error_log stderr;
daemon off;
pid nginx.pid;

events {
}

http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    server {
        listen 1080;
        server_name localhost;
        root /home/app;
        index index.html;

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:8081/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve assets directory normally
        location /assets/ {
            try_files $uri =404;
        }

        # Handle static assets requested with any path prefix (e.g., /annonce/chunk-*.js -> /chunk-*.js)
        # This strips route prefixes from asset requests caused by dynamic base href
        location ~* ^/.+/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
            try_files /$1 =404;
        }

        # Serve Angular app and handle routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
