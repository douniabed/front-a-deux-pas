worker_processes 1;
error_log stderr;
daemon off;
pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    server {
        listen 1080;
        server_name localhost;
        root /home/app;
        index index.html;

        # Proxy API requests to backend
        location /api/ {
            # Handle CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $http_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://backend:8081/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";

            # Add CORS headers to response
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # Serve assets - handle path prefix from dynamic base href
        location ~* /assets/(.*)$ {
            try_files /assets/$1 =404;
        }

        # Serve root static files - handle path prefix from dynamic base href
        location ~* ^.+/([^/]+\.(js|css|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot))$ {
            try_files /$1 =404;
        }

        # Serve Angular app and handle routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
